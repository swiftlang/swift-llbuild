name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.14
    needs: [soundness]
    with:
      enable_cross_pr_testing: true
      linux_os_versions: '["amazonlinux2023", "bookworm", "noble", "jammy", "rhel-ubi9"]'
      linux_pre_build_command: ./.github/scripts/prebuild.sh
      linux_build_command: 'swift test'
      linux_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      linux_host_archs: '["x86_64", "aarch64"]'
      freebsd_build_command: 'swift test'
      enable_freebsd_checks: true
      windows_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      windows_build_command: 'Invoke-Program swift test'
      enable_linux_static_sdk_build: true
      linux_static_sdk_build_command: LLBUILD_STATIC_LINK=1 swift build
      enable_android_sdk_build: true
      android_sdk_build_command: "swift build --build-tests"
      android_ndk_versions: '["r27d", "r29"]'
      enable_ios_checks: true
      enable_macos_checks: true
      macos_xcode_versions: '["swift_6.3", "swift_6.4"]'
      ios_host_xcode_versions: '["swift_6.4"]'
      macos_pre_build_command: ./.github/scripts/prebuild.sh
      macos_build_command: 'swift test'
  tests_without_docker:
    name: Test without Docker
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.14
    needs: [soundness]
    with:
      enable_linux_checks: false
      enable_windows_docker: false
      windows_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      windows_build_command: 'Invoke-Program swift test'
      windows_os_versions: '["windows-2022", "windows-11-arm"]'
  cmake-lit-tests:
    name: CMake / lit tests
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.14
    needs: [soundness]
    with:
      linux_os_versions: '["noble"]'
      linux_pre_build_command: INSTALL_CMAKE=1 ./.github/scripts/prebuild.sh
      linux_build_command: ./.github/scripts/cmake-lit-test.sh
      linux_swift_versions: '["nightly-main"]'
      linux_host_archs: '["x86_64", "aarch64"]'
      enable_windows_checks: false

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.14
    with:
      # The following checks are disabled until the existing sources are brought into compliance.
      license_header_check_enabled: false
      unacceptable_language_check_enabled: false
      shell_check_enabled: false
      python_lint_check_enabled: false
      yamllint_check_enabled: false
      api_breakage_check_enabled: false
      docs_check_enabled: false
      format_check_enabled: false

  build-verdicts:
    name: Build Verdicts
    runs-on: ubuntu-latest
    needs:
      - tests
      - tests_without_docker
      - cmake-lit-tests
      - soundness
    if: always()  # Runs even if previous jobs fail so it can evaluate them
    steps:
      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends coreutils jq
      - name: Check upstream job statuses
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result != "success")) | .[] | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "The following required jobs did not succeed:"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "All required jobs passed successfully!"
